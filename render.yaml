# Milestone 1 demo on Render free tier.
# Generated cards live on ephemeral disk for the live instance; the user deliverable is download.
# Exemplars are not in git — set EXEMPLARS_URL to a zip of assets/exemplars/* at first boot.
# Gate the public URL with DEMO_BASIC_AUTH_* or anyone with the link burns GEMINI_API_KEY.

services:
  - type: web
    name: mtg-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: GENERATION_WORKERS
        value: "1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: EXEMPLARS_URL
        sync: false
      - key: DEMO_BASIC_AUTH_USER
        sync: false
      - key: DEMO_BASIC_AUTH_PASSWORD
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

  - type: web
    name: mtg-web
    runtime: node
    plan: free
    rootDir: frontend
    # Render's filesystem is read-only under /usr — no corepack enable, no npm -g.
    buildCommand: npx --yes pnpm@10.33.2 install --frozen-lockfile && npx --yes pnpm@10.33.2 build
    startCommand: npx --yes pnpm@10.33.2 exec next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: BACKEND_ORIGIN
        fromService:
          name: mtg-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DEMO_BASIC_AUTH_USER
        sync: false
      - key: DEMO_BASIC_AUTH_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
